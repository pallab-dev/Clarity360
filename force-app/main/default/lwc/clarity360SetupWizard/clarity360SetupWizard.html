<template>
    <lightning-card title="Clarity360 Setup Wizard" icon-name="utility:setup">
        <div class="wizard-shell slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-progress-indicator current-step={currentStepValue} type="path" variant="base">
                <lightning-progress-step label="Welcome" value="1"></lightning-progress-step>
                <lightning-progress-step label="Readiness" value="2"></lightning-progress-step>
                <lightning-progress-step label="Configuration" value="3"></lightning-progress-step>
                <lightning-progress-step label="Initial Run" value="4"></lightning-progress-step>
            </lightning-progress-indicator>
        </div>

        <template if:true={isBusy}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <lightning-spinner size="small" alternative-text="Loading setup wizard"></lightning-spinner>
            </div>
        </template>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isStepWelcome}>
                <div class="panel">
                    <div class="tour-head">
                        <div>
                            <h2 class="slds-text-heading_small slds-m-bottom_x-small">Welcome to Clarity360</h2>
                            <p>Setup will validate org readiness, save runtime configuration, and optionally start your initial scans.</p>
                            <p class="slds-m-top_x-small">Estimated time: 5-10 minutes.</p>
                        </div>
                        <lightning-button label="Take Guided Tour" onclick={handleOpenTour}></lightning-button>
                    </div>
                    <div class="tour-summary slds-m-top_small">
                        <strong>Quick start:</strong> Run readiness checks, choose scan scope, add the scheduled report email if you want admin summaries, then launch the first scan.
                    </div>
                </div>
            </template>

            <template if:true={isStepReadiness}>
                <div class="panel">
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small">Org Readiness Checks</h2>
                    <p class="slds-m-bottom_small">Overall status: <strong>{readinessStatus}</strong></p>
                    <p class="slds-m-bottom_small">{readinessSummaryLabel}</p>
                    <template if:true={hasBlockedReadiness}>
                        <p class="slds-text-color_error slds-m-bottom_small">
                            Required checks are blocked. Resolve the remediation guidance below to continue.
                        </p>
                    </template>
                    <template for:each={readinessGroups} for:item="group">
                        <section key={group.key} class={group.sectionClass}>
                            <button class="group-toggle" type="button" data-group={group.key} onclick={handleToggleGroup}>
                                <lightning-icon icon-name={group.iconName} size="x-small" class="group-icon"></lightning-icon>
                                <span class="group-title">{group.label}</span>
                                <span class="group-summary">{group.summary}</span>
                                <span class="status-pill">{group.status}</span>
                            </button>
                            <template if:true={group.expanded}>
                                <div class="group-body">
                                    <template for:each={group.checks} for:item="item">
                                        <div key={item.key} class={item.rowClass}>
                                            <div class="check-head">
                                                <span>{item.label}</span>
                                                <span class="status-pill">{item.status}</span>
                                            </div>
                                            <div>{item.message}</div>
                                            <div class="muted">{item.remediation}</div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </section>
                    </template>
                    <div class="slds-m-top_small">
                        <lightning-button label="Run Checks Again" onclick={handleRunReadiness}></lightning-button>
                    </div>
                </div>
            </template>

            <template if:true={isStepConfig}>
                <div class="panel form-grid">
                    <div class="setup-choice-card">
                        <h3 class="slds-text-title_bold">1. Standard Objects</h3>
                        <p class="slds-m-top_x-small">{scopeHelpText}</p>
                        <lightning-input
                            class="slds-m-top_small"
                            type="toggle"
                            label="Include Standard Objects"
                            field-level-help="Turn this on when you want Clarity360 to review both standard and custom objects. Turn it off to focus only on custom objects."
                            message-toggle-active="Included"
                            message-toggle-inactive="Custom objects only"
                            checked={includeStandardObjects}
                            data-field="includeStandardObjects"
                            onchange={handleIncludeStandardObjectsChange}
                        ></lightning-input>
                    </div>

                    <div class="setup-choice-card">
                        <h3 class="slds-text-title_bold">2. Recommendation Sensitivity</h3>
                        <p class="slds-m-top_x-small">{coverageHelpText}</p>
                        <lightning-input
                            class="slds-m-top_small"
                            type="number"
                            label="Coverage Threshold (%)"
                            field-level-help="This is the coverage level Clarity360 uses when it interprets Apex evidence. Higher values are stricter."
                            value={coverageThreshold}
                            data-field="coverageThreshold"
                            min="0"
                            max="100"
                            onchange={handleCoverageThresholdChange}
                        ></lightning-input>
                    </div>

                    <div class="setup-choice-card setup-choice-card-advanced">
                        <div class="advanced-head">
                            <div>
                                <h3 class="slds-text-title_bold">Advanced Options</h3>
                                <p class="slds-m-top_x-small">Optional controls for exclusions and automation.</p>
                            </div>
                            <lightning-button
                                label={advancedToggleLabel}
                                variant="base"
                                onclick={handleToggleAdvanced}
                            ></lightning-button>
                        </div>

                        <template if:true={showAdvancedOptions}>
                            <div class="advanced-grid slds-m-top_small">
                                <lightning-textarea
                                    label="Excluded Objects"
                                    field-level-help="Add object API names to skip from scans, separated by commas or new lines."
                                    value={excludedObjects}
                                    data-field="excludedObjects"
                                    onchange={handleExcludedObjectsChange}
                                ></lightning-textarea>
                                <lightning-textarea
                                    label="Excluded Namespaces"
                                    field-level-help="Use this when you want to ignore managed package namespaces during analysis."
                                    value={excludedNamespaces}
                                    data-field="excludedNamespaces"
                                    onchange={handleExcludedNamespacesChange}
                                ></lightning-textarea>
                                <lightning-input
                                    type="checkbox"
                                    label="Use Named Credential"
                                    field-level-help="Recommended for secure, reliable metadata callouts."
                                    checked={useNamedCredential}
                                    data-field="useNamedCredential"
                                    onchange={handleUseNamedCredentialChange}
                                ></lightning-input>
                                <lightning-input
                                    type="checkbox"
                                    label="Enable Scheduled Scan"
                                    field-level-help="Turns on automatic recurring full scans."
                                    checked={enableScheduledScan}
                                    data-field="enableScheduledScan"
                                    onchange={handleEnableScheduledScanChange}
                                ></lightning-input>
                                <lightning-input
                                    type="checkbox"
                                    label="Send Scheduled Scan Report"
                                    field-level-help="When enabled, Clarity360 emails a report after each scheduled full scan."
                                    checked={enableScheduledReports}
                                    data-field="enableScheduledReports"
                                    disabled={isScheduledReportsDisabled}
                                    onchange={handleEnableScheduledReportsChange}
                                ></lightning-input>
                                <lightning-input
                                    type="email"
                                    label="Scheduled Report Email"
                                    field-level-help="Optional. Enter an address if scheduled reports should go to a shared mailbox or admin inbox. Leave it blank to send the report to the user who owns the schedule run."
                                    placeholder="Leave blank to send to the scheduling user"
                                    value={scheduledReportRecipient}
                                    data-field="scheduledReportRecipient"
                                    disabled={isScheduledReportRecipientDisabled}
                                    onchange={handleScheduledReportRecipientChange}
                                ></lightning-input>
                                <template if:true={showScheduleControls}>
                                    <lightning-combobox
                                        label="Schedule Frequency"
                                        field-level-help="Choose how often Clarity360 should run the scheduled full scan."
                                        value={scheduleFrequency}
                                        options={scheduleOptions}
                                        data-field="scheduleFrequency"
                                        placeholder="Choose a frequency"
                                        disabled={isScheduleFrequencyDisabled}
                                        onchange={handleScheduleFrequencyChange}
                                    ></lightning-combobox>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
                <p class="slds-m-top_small slds-text-body_small">
                    Pick the main scan behavior here. If you leave something blank, Clarity360 can use the org default and you can optimize it later.
                </p>
                <p class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                    Scan capacity, sample volume, and other engine guardrails are developer-managed. Setup only captures subscriber scope and behavior preferences.
                </p>
            </template>

            <template if:true={isStepInitialRun}>
                <div class="panel">
                    <lightning-input
                        type="checkbox"
                        label="Also run usage scan after inventory"
                        field-level-help="Recommended when you want the first run to include actual field usage evidence and recommendations."
                        checked={runUsageScan}
                        onchange={handleRunUsageChange}
                    ></lightning-input>
                    <div class="slds-m-top_small">
                        <lightning-button variant="brand" label="Start Initial Run" onclick={handleStartInitialRun}></lightning-button>
                    </div>
                    <template if:true={initialRunMessage}>
                        <p class="slds-m-top_small">{initialRunMessage}</p>
                    </template>
                </div>
            </template>
        </div>

        <div class="wizard-footer slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-button label="Back" onclick={handleBack} disabled={disableBack}></lightning-button>
            <lightning-button variant="brand" label={nextLabel} onclick={handleNext} disabled={disableNext}></lightning-button>
        </div>

        <template if:true={isTourOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true" aria-label="Clarity360 guided tour">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close guided tour"
                            class="slds-modal__close"
                            onclick={handleCloseTour}
                        ></lightning-button-icon>
                        <h2 class="slds-text-heading_medium">Setup Guided Tour</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="tour-step-count">Step {currentTourStepNumber} of {tourStepCount}</div>
                        <h3 class="slds-text-heading_small slds-m-top_x-small">{currentTourStep.title}</h3>
                        <p class="slds-m-top_small">{currentTourStep.body}</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Back" onclick={handlePreviousTourStep} disabled={disablePreviousTourStep}></lightning-button>
                        <lightning-button variant="brand" label={tourNextLabel} onclick={handleNextTourStep}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
