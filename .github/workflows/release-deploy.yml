name: Release Deploy

on:
  pull_request_target:
    branches:
      - 'release/**'
    types:
      - closed

concurrency:
  group: release-deploy-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: true

jobs:
  verify-release-merge:
    name: Verify Release Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      actions: read
      pull-requests: read
    outputs:
      merge_sha: ${{ steps.verify.outputs.merge_sha }}
    steps:
      - name: Verify release PR validation succeeded
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            if (!pull || !pull.merged) {
              core.setFailed('Only merged pull requests can trigger release deployment.');
              return;
            }

            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-validation.yml',
              event: 'pull_request',
              per_page: 100,
            });

            const validationRun = runsResponse.data.workflow_runs.find((run) =>
              run.head_sha === pull.head.sha && run.conclusion === 'success'
            );

            if (!validationRun) {
              core.setFailed(`Release deployment is blocked because PR validation did not succeed for PR #${pull.number}.`);
              return;
            }

            core.setOutput('merge_sha', pull.merge_commit_sha || context.sha);

  deploy-testorg:
    name: Deploy To Testing Org
    runs-on: ubuntu-latest
    needs: verify-release-merge
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout merged release content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-release-merge.outputs.merge_sha }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Deploy source to Testing Org
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30 \
            --concise

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  post-deploy-tests:
    name: Post-Deploy Tests
    runs-on: ubuntu-latest
    needs:
      - verify-release-merge
      - deploy-testorg
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout merged release content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-release-merge.outputs.merge_sha }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Run post-deploy Apex tests in Testing Org
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunSpecifiedTests \
            --tests Clarity360SmokeTest \
            --result-format human \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  release-deployment:
    name: Release Deployment
    runs-on: ubuntu-latest
    needs: post-deploy-tests
    if: github.event.pull_request.merged == true
    steps:
      - name: Mark release deployment successful
        run: echo "Release branch deployment completed successfully."
