name: Production Pipeline

on:
  push:
    branches:
      - production

jobs:
  production-pipeline:
    name: production-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Validate required production secrets
        run: |
          test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }
          test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Run quality gates
        uses: ./.github/actions/quality-gates

      - name: Read beta version ID from .version-id file
        id: ver
        run: |
          echo "VERSION_ID=$(cat .version-id)" >> "$GITHUB_OUTPUT"

      - name: Promote package version from Beta to Released
        run: |
          sf package version promote \
            --package ${{ steps.ver.outputs.VERSION_ID }} \
            --no-prompt

      - name: Skip PBO deployment until PBO org is available
        run: echo "PBO deployment and smoke tests are disabled until PBOORG_SFDX_URL is configured."

      - name: Create a production Git release tag
        run: |
          TAG="release-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Clean up key files
        if: always()
        run: rm -f devhub.sfdx-url testorg.sfdx-url
