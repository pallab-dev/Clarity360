name: Production Pipeline

on:
  push:
    branches:
      - production

jobs:
  pmd-scan:
    name: PMD Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run PMD scan
        run: |
          sf scanner run \
            --target "./force-app/**/*.cls" \
            --target "./force-app/**/*.trigger" \
            --engine pmd \
            --severity-threshold 2 \
            --format table \
            --verbose-violations

  eslint-scan:
    name: ESLint
    runs-on: ubuntu-latest
    needs: pmd-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: eslint-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Salesforce Scanner security rules
        run: |
          sf scanner run \
            --target "./force-app" \
            --category "Security" \
            --severity-threshold 1 \
            --format table \
            --verbose-violations

  xml-validation:
    name: XML Validation
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML files
        run: find force-app manifest -type f -name '*.xml' -print0 | xargs -0 xmllint --noout

  metadata-validation:
    name: Metadata Validation
    runs-on: ubuntu-latest
    needs: xml-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Validate metadata deployment to Testing Org
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --dry-run \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  appexchange-review:
    name: AppExchange Review
    runs-on: ubuntu-latest
    needs: metadata-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Code Analyzer v5
        run: sf plugins install code-analyzer

      - name: Run AppExchange security review scan
        run: |
          sf code-analyzer run \
            --workspace force-app/main/default \
            --rule-selector AppExchange \
            --rule-selector Recommended:Security \
            --severity-threshold 2 \
            --view detail

  deploy-test-source-for-tests:
    name: Deploy Test Source
    runs-on: ubuntu-latest
    needs:
      - appexchange-review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Deploy source to Testing Org for Apex validation
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  apex-tests:
    name: Apex Tests
    runs-on: ubuntu-latest
    needs: deploy-test-source-for-tests
    steps:
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Run Apex tests with coverage
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  apex-coverage:
    name: Apex Coverage
    runs-on: ubuntu-latest
    needs: apex-tests
    steps:
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Verify org-wide Apex coverage
        run: |
          ORG_COVERAGE_JSON=$(sf data query \
            --use-tooling-api \
            --json \
            --target-org testorg \
            --query "SELECT PercentCovered FROM ApexOrgWideCoverage")
          ORG_COVERAGE_PCT=$(echo "$ORG_COVERAGE_JSON" | jq -r '.result.records[0].PercentCovered // empty')
          if [ -z "$ORG_COVERAGE_PCT" ]; then
            echo "Unable to determine org-wide Apex coverage from tooling query."
            exit 1
          fi
          if ! awk "BEGIN {exit !($ORG_COVERAGE_PCT >= 75)}"; then
            echo "Org-wide Apex coverage is below 75%: ${ORG_COVERAGE_PCT}%"
            exit 1
          fi

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  promote-package:
    name: Promote Package
    runs-on: ubuntu-latest
    needs: apex-coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate promotion prerequisites
        run: |
          if [ ! -f .version-id ]; then
            echo ".version-id is not present. Package promotion is skipped."
            exit 0
          fi
          test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        if: ${{ hashFiles('.version-id') != '' }}
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        if: ${{ hashFiles('.version-id') != '' }}
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Read beta version ID from .version-id file
        if: ${{ hashFiles('.version-id') != '' }}
        id: ver
        run: echo "VERSION_ID=$(cat .version-id)" >> "$GITHUB_OUTPUT"

      - name: Promote package version from Beta to Released
        if: ${{ hashFiles('.version-id') != '' }}
        run: |
          sf package version promote \
            --package ${{ steps.ver.outputs.VERSION_ID }} \
            --no-prompt

      - name: Clean up auth file
        if: always()
        run: rm -f devhub.sfdx-url

  create-release-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: promote-package
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip release tag when no version exists
        if: ${{ hashFiles('.version-id') == '' }}
        run: echo ".version-id is not present. Release tag creation is skipped."

      - name: Create a production Git release tag
        if: ${{ hashFiles('.version-id') != '' }}
        run: |
          TAG="release-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

  production-pipeline:
    name: production-pipeline
    runs-on: ubuntu-latest
    needs:
      - create-release-tag
    steps:
      - name: Mark production pipeline successful
        run: echo "Production pipeline completed successfully."
