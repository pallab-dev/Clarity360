name: Production Pipeline

on:
  push:
    branches:
      - production

jobs:
  production-pipeline:
    name: production-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Write Dev Hub JWT key to file
        run: echo "${{ secrets.DEVHUB_JWT_KEY }}" > devhub.key

      - name: Authenticate Dev Hub via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.DEVHUB_CLIENT_ID }} \
            --jwt-key-file devhub.key \
            --username ${{ secrets.DEVHUB_USERNAME }} \
            --set-default-dev-hub \
            --alias devhub

      - name: Write Testing Org JWT key to file
        run: echo "${{ secrets.TESTORG_JWT_KEY }}" > testorg.key

      - name: Authenticate Testing Org via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.TESTORG_CLIENT_ID }} \
            --jwt-key-file testorg.key \
            --username ${{ secrets.TESTORG_USERNAME }} \
            --alias testorg

      - name: Write PBO Org JWT key to file
        run: echo "${{ secrets.PBOORG_JWT_KEY }}" > pboorg.key

      - name: Authenticate PBO Org via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.PBOORG_CLIENT_ID }} \
            --jwt-key-file pboorg.key \
            --username ${{ secrets.PBOORG_USERNAME }} \
            --alias pboorg

      - name: Run quality gates
        uses: ./.github/actions/quality-gates

      - name: Read beta version ID from .version-id file
        id: ver
        run: |
          echo "VERSION_ID=$(cat .version-id)" >> "$GITHUB_OUTPUT"

      - name: Promote package version from Beta to Released
        run: |
          sf package version promote \
            --package ${{ steps.ver.outputs.VERSION_ID }} \
            --no-prompt

      - name: Install released package in PBO Org
        run: |
          sf package install \
            --package ${{ steps.ver.outputs.VERSION_ID }} \
            --target-org pboorg \
            --installation-key-bypass \
            --wait 30

      - name: Run smoke test in PBO Org after install
        run: |
          sf apex run test \
            --target-org pboorg \
            --test-level RunLocalTests \
            --result-format human \
            --wait 30

      - name: Create a production Git release tag
        run: |
          TAG="release-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Clean up key files
        if: always()
        run: rm -f devhub.key testorg.key pboorg.key
