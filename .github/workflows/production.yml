name: Production Pipeline

on:
  pull_request:
    branches:
      - production
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - production

concurrency:
  group: production-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pmd-scan:
    name: PMD Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run PMD scan
        run: |
          sf scanner run \
            --target "./force-app/**/*.cls" \
            --target "./force-app/**/*.trigger" \
            --engine pmd \
            --severity-threshold 2 \
            --format table \
            --verbose-violations

  eslint-scan:
    name: ESLint
    runs-on: ubuntu-latest
    needs: pmd-scan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: eslint-scan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Salesforce Scanner security rules
        run: |
          sf scanner run \
            --target "./force-app" \
            --category "Security" \
            --severity-threshold 1 \
            --format table \
            --verbose-violations

  xml-validation:
    name: XML Validation
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML files
        run: find force-app manifest -type f -name '*.xml' -print0 | xargs -0 xmllint --noout

  metadata-validation:
    name: Metadata Validation
    runs-on: ubuntu-latest
    needs: xml-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required project files
        run: |
          test -f sfdx-project.json || { echo "Missing sfdx-project.json"; exit 1; }
          test -f config/project-scratch-def.json || { echo "Missing config/project-scratch-def.json"; exit 1; }

  appexchange-review:
    name: AppExchange Review
    runs-on: ubuntu-latest
    needs: metadata-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run AppExchange PMD review scan
        run: |
          sf scanner run \
            --engine pmd-appexchange \
            --target "./" \
            --severity-threshold 2 \
            --format table \
            --verbose-violations

  testorg-validation:
    name: Testing Org Validation
    runs-on: ubuntu-latest
    needs: appexchange-review
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Detect changed Apex members
        run: |
          mkdir -p .ci
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-only --diff-filter=ACMRTUXB "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            -- force-app/main/default > .ci/changed-source-paths-raw.txt
          while IFS= read -r changed_path; do
            if [ -e "$changed_path" ]; then
              echo "$changed_path"
            fi
          done < .ci/changed-source-paths-raw.txt > .ci/changed-source-paths.txt
          grep -E '\.(cls|trigger)$' .ci/changed-source-paths.txt | grep -Ev 'Test\.cls$' > .ci/changed-apex-members.txt || true
          find force-app/main/default/classes -name '*Test.cls' -print \
            | sed 's#force-app/main/default/classes/##' \
            | sed 's#\.cls$##' \
            | sort > .ci/local-test-classes.txt
          echo "Changed deploy source paths:"
          cat .ci/changed-source-paths.txt || true
          echo "Changed Apex members:"
          cat .ci/changed-apex-members.txt || true

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Validate changed Apex member coverage
        run: |
          if [ ! -s .ci/changed-apex-members.txt ]; then
            echo "No changed non-test Apex classes or triggers detected."
            exit 0
          fi
          declare -a SOURCE_ARGS
          while IFS= read -r member; do
            SOURCE_ARGS+=(--source-dir "$member")
          done < .ci/changed-source-paths.txt
          declare -a TEST_ARGS
          while IFS= read -r test_class; do
            TEST_ARGS+=(--tests "$test_class")
          done < .ci/local-test-classes.txt
          # RunSpecifiedTests enforces 75% coverage on each class/trigger in the deployment package.
          sf project deploy start \
            --target-org testorg \
            "${SOURCE_ARGS[@]}" \
            --ignore-conflicts \
            --dry-run \
            --test-level RunSpecifiedTests \
            "${TEST_ARGS[@]}" \
            --coverage-formatters text-summary \
            --results-dir changed-apex-validation \
            --wait 30

      - name: Validate full package deployment in Testing Org
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --dry-run \
            --test-level RunLocalTests \
            --coverage-formatters text-summary \
            --results-dir full-package-validation \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  verify-production-merge:
    name: Verify Production Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      pull-requests: read
    steps:
      - name: Verify push commit is associated with a pull request
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            if (!response.data.length) {
              core.setFailed('Direct pushes to production are not allowed. Merge through a pull request.');
              return;
            }
            const mergedPull = response.data.find((pull) => pull.merged_at);
            if (!mergedPull) {
              core.setFailed('Push commit is not associated with a merged pull request.');
            }

  promote-package:
    name: Promote Package
    runs-on: ubuntu-latest
    needs: verify-production-merge
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate promotion prerequisites
        run: |
          if [ ! -f .version-id ]; then
            echo ".version-id is not present. Package promotion is skipped."
            exit 0
          fi
          test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        if: ${{ hashFiles('.version-id') != '' }}
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        if: ${{ hashFiles('.version-id') != '' }}
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Read beta version ID from .version-id file
        if: ${{ hashFiles('.version-id') != '' }}
        id: ver
        run: echo "VERSION_ID=$(cat .version-id)" >> "$GITHUB_OUTPUT"

      - name: Promote package version from Beta to Released
        if: ${{ hashFiles('.version-id') != '' }}
        run: |
          sf package version promote \
            --package ${{ steps.ver.outputs.VERSION_ID }} \
            --no-prompt

      - name: Clean up auth file
        if: always()
        run: rm -f devhub.sfdx-url

  create-release-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: promote-package
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip release tag when no version exists
        if: ${{ hashFiles('.version-id') == '' }}
        run: echo ".version-id is not present. Release tag creation is skipped."

      - name: Create a production Git release tag
        if: ${{ hashFiles('.version-id') != '' }}
        run: |
          TAG="release-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

  production-pipeline:
    name: production-pipeline
    runs-on: ubuntu-latest
    needs: testorg-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Mark production pipeline successful
        run: echo "Production pull request validation completed successfully."

  production-release:
    name: Production Release
    runs-on: ubuntu-latest
    needs: create-release-tag
    if: github.event_name == 'push'
    steps:
      - name: Mark production release successful
        run: echo "Production release steps completed successfully."
