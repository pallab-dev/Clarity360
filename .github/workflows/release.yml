name: Release Pipeline

on:
  push:
    branches:
      - 'release/**'

jobs:
  release-pipeline:
    name: release-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Write Dev Hub JWT key to file
        run: echo "${{ secrets.DEVHUB_JWT_KEY }}" > devhub.key

      - name: Authenticate Dev Hub via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.DEVHUB_CLIENT_ID }} \
            --jwt-key-file devhub.key \
            --username ${{ secrets.DEVHUB_USERNAME }} \
            --set-default-dev-hub \
            --alias devhub

      - name: Write Testing Org JWT key to file
        run: echo "${{ secrets.TESTORG_JWT_KEY }}" > testorg.key

      - name: Authenticate Testing Org via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.TESTORG_CLIENT_ID }} \
            --jwt-key-file testorg.key \
            --username ${{ secrets.TESTORG_USERNAME }} \
            --alias testorg

      - name: Run quality gates
        uses: ./.github/actions/quality-gates

      - name: Build beta package version
        id: pkg
        run: |
          RESULT=$(sf package version create \
            --package "${{ secrets.PACKAGE_ID }}" \
            --installation-key-bypass \
            --code-coverage \
            --wait 30 \
            --json)
          echo "VERSION_ID=$(echo "$RESULT" | jq -r '.result.SubscriberPackageVersionId')" >> "$GITHUB_OUTPUT"

      - name: Install beta package in Testing Org
        run: |
          sf package install \
            --package ${{ steps.pkg.outputs.VERSION_ID }} \
            --target-org testorg \
            --installation-key-bypass \
            --wait 30

      - name: Run full test suite in Testing Org after install
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Save version ID to .version-id file and commit
        run: |
          echo "${{ steps.pkg.outputs.VERSION_ID }}" > .version-id
          git config user.email "ci-bot@yourdomain.com"
          git config user.name "CI Bot"
          git add .version-id
          git commit -m "chore: update beta version ID [skip ci]" || echo "No changes to commit"
          git push

      - name: Create a Git tag for this beta
        run: |
          TAG="beta-${{ github.ref_name }}-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Clean up key files
        if: always()
        run: rm -f devhub.key testorg.key
