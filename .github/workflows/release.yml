name: Release Pipeline

on:
  push:
    branches:
      - 'release/**'

jobs:
  prepare-changes:
    name: Prepare Changes
    runs-on: ubuntu-latest
    outputs:
      changed_apex_files: ${{ steps.diff.outputs.changed_apex_files }}
      changed_non_test_apex_names: ${{ steps.diff.outputs.changed_non_test_apex_names }}
      has_changed_apex: ${{ steps.diff.outputs.has_changed_apex }}
      has_changed_non_test_apex: ${{ steps.diff.outputs.has_changed_non_test_apex }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Apex and trigger files
        id: diff
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BASE_SHA=$(git rev-parse HEAD^)
            else
              BASE_SHA=$(git rev-list --max-parents=0 HEAD)
            fi
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          CHANGED_APEX_FILES=$(printf '%s\n' "$CHANGED_FILES" | grep -E '^force-app/main/default/(classes/.*\.cls|triggers/.*\.trigger)$' || true)
          CHANGED_NON_TEST_APEX_NAMES=$(printf '%s\n' "$CHANGED_APEX_FILES" | sed -nE "s#^force-app/main/default/classes/([^/]+)\.cls$#\1#p; s#^force-app/main/default/triggers/([^/]+)\.trigger$#\1#p" | grep -Ev 'Test$' || true)

          {
            echo "changed_apex_files<<EOF"
            printf '%s\n' "$CHANGED_APEX_FILES"
            echo "EOF"
            echo "changed_non_test_apex_names<<EOF"
            printf '%s\n' "$CHANGED_NON_TEST_APEX_NAMES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$CHANGED_APEX_FILES" ]; then
            echo "has_changed_apex=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_apex=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$CHANGED_NON_TEST_APEX_NAMES" ]; then
            echo "has_changed_non_test_apex=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_non_test_apex=false" >> "$GITHUB_OUTPUT"
          fi

  pmd-scan:
    name: PMD Scan
    runs-on: ubuntu-latest
    needs: prepare-changes
    env:
      CHANGED_APEX_FILES: ${{ needs.prepare-changes.outputs.changed_apex_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run PMD scan
        run: |
          if [ -z "$CHANGED_APEX_FILES" ]; then
            echo "No Apex or trigger changes detected. PMD scan is skipped."
            exit 0
          fi

          TARGET_ARGS=()
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            TARGET_ARGS+=(--target "$file")
          done <<< "$CHANGED_APEX_FILES"

          sf scanner run \
            "${TARGET_ARGS[@]}" \
            --engine pmd \
            --severity-threshold 2 \
            --format csv \
            --outfile pmd-results.csv

      - name: Upload PMD results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-results
          path: pmd-results.csv
          if-no-files-found: ignore

  eslint-scan:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: prepare-changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Salesforce Scanner security rules
        run: |
          sf scanner run \
            --target "./force-app" \
            --category "Security" \
            --severity-threshold 1 \
            --format csv \
            --outfile scanner-security-results.csv

      - name: Upload scanner security results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-security-results
          path: scanner-security-results.csv
          if-no-files-found: ignore

  apex-tests:
    name: Apex Tests
    runs-on: ubuntu-latest
    needs: prepare-changes
    env:
      CHANGED_NON_TEST_APEX_NAMES: ${{ needs.prepare-changes.outputs.changed_non_test_apex_names }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Deploy source to Testing Org for Apex validation
        if: ${{ needs.prepare-changes.outputs.has_changed_non_test_apex == 'true' }}
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30

      - name: Run Apex tests with coverage
        if: ${{ needs.prepare-changes.outputs.has_changed_non_test_apex == 'true' }}
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30 | tee apex-test-results.txt
          ORG_COVERAGE=$(sf data query --use-tooling-api --json --target-org testorg --query "SELECT PercentCovered FROM ApexOrgWideCoverage")
          ORG_COVERAGE_PCT=$(echo "$ORG_COVERAGE" | jq -r '.result.records[0].PercentCovered // empty')
          if [ -z "$ORG_COVERAGE_PCT" ]; then
            echo "Unable to determine org-wide Apex coverage from tooling query."
            exit 1
          fi
          if ! awk "BEGIN {exit !($ORG_COVERAGE_PCT >= 75)}"; then
            echo "Org-wide Apex coverage is below 75%: ${ORG_COVERAGE_PCT}%"
            exit 1
          fi

          SOQL_NAMES=$(printf '%s\n' "$CHANGED_NON_TEST_APEX_NAMES" | sed "/^$/d; s/'/\\\\'/g; s/.*/'&'/" | paste -sd, -)
          if [ -z "$SOQL_NAMES" ]; then
            echo "No non-test Apex classes or triggers changed. Individual coverage validation is skipped."
            exit 0
          fi

          COVERAGE_JSON=$(sf data query --use-tooling-api --json --target-org testorg --query "SELECT ApexClassOrTrigger.Name, NumLinesCovered, NumLinesUncovered FROM ApexCodeCoverageAggregate WHERE ApexClassOrTrigger.Name IN ($SOQL_NAMES)")

          while IFS= read -r apex_name; do
            [ -n "$apex_name" ] || continue
            COVERED=$(echo "$COVERAGE_JSON" | jq -r --arg NAME "$apex_name" '.result.records[]? | select(.ApexClassOrTrigger.Name == $NAME) | .NumLinesCovered' | head -n 1)
            UNCOVERED=$(echo "$COVERAGE_JSON" | jq -r --arg NAME "$apex_name" '.result.records[]? | select(.ApexClassOrTrigger.Name == $NAME) | .NumLinesUncovered' | head -n 1)
            if [ -z "$COVERED" ] || [ -z "$UNCOVERED" ]; then
              echo "No coverage aggregate found for $apex_name."
              exit 1
            fi
            TOTAL=$((COVERED + UNCOVERED))
            if [ "$TOTAL" -le 0 ]; then
              echo "No executable lines reported for $apex_name."
              exit 1
            fi
            PERCENT=$((COVERED * 100 / TOTAL))
            if [ "$PERCENT" -lt 75 ]; then
              echo "$apex_name coverage is below 75%: ${PERCENT}%"
              exit 1
            fi
          done <<< "$CHANGED_NON_TEST_APEX_NAMES"

      - name: Skip Apex validation when no non-test Apex changed
        if: ${{ needs.prepare-changes.outputs.has_changed_non_test_apex != 'true' }}
        run: echo "No non-test Apex or trigger changes detected. Apex deployment and coverage validation are skipped."

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  release-package:
    name: Build And Deploy Beta
    runs-on: ubuntu-latest
    needs:
      - prepare-changes
      - pmd-scan
      - eslint-scan
      - security-scan
      - apex-tests
    permissions:
      contents: write
    env:
      DEVHUB_SFDX_URL: ${{ secrets.DEVHUB_SFDX_URL }}
      TESTORG_SFDX_URL: ${{ secrets.TESTORG_SFDX_URL }}
      PACKAGE_ID: ${{ secrets.PACKAGE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate package deployment secrets
        run: |
          test -n "$DEVHUB_SFDX_URL" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }
          test -n "$TESTORG_SFDX_URL" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "$DEVHUB_SFDX_URL" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Write Testing Org auth URL to file
        run: echo "$TESTORG_SFDX_URL" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Build beta package version
        id: pkg
        if: ${{ env.PACKAGE_ID != '' }}
        run: |
          RESULT=$(sf package version create \
            --package "$PACKAGE_ID" \
            --installation-key-bypass \
            --code-coverage \
            --wait 30 \
            --json)
          echo "VERSION_ID=$(echo "$RESULT" | jq -r '.result.SubscriberPackageVersionId')" >> "$GITHUB_OUTPUT"

      - name: Install beta package in Testing Org
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          sf package install \
            --package ${{ steps.pkg.outputs.VERSION_ID }} \
            --target-org testorg \
            --installation-key-bypass \
            --wait 30

      - name: Run full test suite in Testing Org after install
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Save version ID to .version-id file and commit
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          echo "${{ steps.pkg.outputs.VERSION_ID }}" > .version-id
          git config user.email "ci-bot@yourdomain.com"
          git config user.name "CI Bot"
          git add .version-id
          git commit -m "chore: update beta version ID [skip ci]" || echo "No changes to commit"
          git push

      - name: Create a Git tag for this beta
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          TAG="beta-${{ github.ref_name }}-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Skip package build until PACKAGE_ID is configured
        if: ${{ env.PACKAGE_ID == '' }}
        run: echo "PACKAGE_ID is not configured. Package build, install, version persistence, and beta tagging are skipped."

      - name: Clean up auth files
        if: always()
        run: rm -f devhub.sfdx-url testorg.sfdx-url

  release-pipeline:
    name: release-pipeline
    runs-on: ubuntu-latest
    needs:
      - prepare-changes
      - pmd-scan
      - eslint-scan
      - security-scan
      - apex-tests
      - release-package
    steps:
      - name: Mark release pipeline successful
        run: echo "Release pipeline completed successfully."
