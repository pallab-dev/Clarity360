name: Release Pipeline

on:
  pull_request:
    branches:
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - 'release/**'

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pmd-scan:
    name: PMD Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run PMD scan
        run: |
          sf scanner run \
            --target "./force-app/**/*.cls" \
            --target "./force-app/**/*.trigger" \
            --engine pmd \
            --severity-threshold 2 \
            --format table \
            --verbose-violations

  eslint-scan:
    name: ESLint
    runs-on: ubuntu-latest
    needs: pmd-scan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: eslint-scan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Salesforce Scanner security rules
        run: |
          sf scanner run \
            --target "./force-app" \
            --category "Security" \
            --severity-threshold 1 \
            --format table \
            --verbose-violations

  xml-validation:
    name: XML Validation
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML files
        run: find force-app manifest -type f -name '*.xml' -print0 | xargs -0 xmllint --noout

  metadata-validation:
    name: Metadata Validation
    runs-on: ubuntu-latest
    needs: xml-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required project files
        run: |
          test -f sfdx-project.json || { echo "Missing sfdx-project.json"; exit 1; }
          test -f config/project-scratch-def.json || { echo "Missing config/project-scratch-def.json"; exit 1; }

  appexchange-review:
    name: AppExchange Review
    runs-on: ubuntu-latest
    needs: metadata-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run AppExchange PMD review scan
        run: |
          sf scanner run \
            --engine pmd-appexchange \
            --target "./" \
            --severity-threshold 2 \
            --format table \
            --verbose-violations

  testorg-validation:
    name: Testing Org Validation
    runs-on: ubuntu-latest
    needs: appexchange-review
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Detect changed Apex members
        run: |
          mkdir -p .ci
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            -- 'force-app/main/default/classes/*.cls' \
            -- 'force-app/main/default/triggers/*.trigger' > .ci/changed-apex-all.txt
          grep -Ev 'Test\.cls$' .ci/changed-apex-all.txt > .ci/changed-apex-members.txt || true
          find force-app/main/default/classes -name '*Test.cls' -print \
            | sed 's#force-app/main/default/classes/##' \
            | sed 's#\.cls$##' \
            | sort > .ci/local-test-classes.txt
          echo "Changed Apex members:"
          cat .ci/changed-apex-members.txt || true

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Validate changed Apex member coverage
        run: |
          if [ ! -s .ci/changed-apex-members.txt ]; then
            echo "No changed non-test Apex classes or triggers detected."
            exit 0
          fi
          SOURCE_ARGS=""
          while IFS= read -r member; do
            SOURCE_ARGS="$SOURCE_ARGS --source-dir $member"
          done < .ci/changed-apex-members.txt
          TEST_ARGS=""
          while IFS= read -r test_class; do
            TEST_ARGS="$TEST_ARGS --tests $test_class"
          done < .ci/local-test-classes.txt
          # RunSpecifiedTests enforces 75% coverage on each class/trigger in the deployment package.
          eval sf project deploy start \
            --target-org testorg \
            $SOURCE_ARGS \
            --ignore-conflicts \
            --dry-run \
            --test-level RunSpecifiedTests \
            $TEST_ARGS \
            --coverage-formatters text-summary \
            --results-dir changed-apex-validation \
            --wait 30

      - name: Validate full package deployment in Testing Org
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --dry-run \
            --test-level RunLocalTests \
            --coverage-formatters text-summary \
            --results-dir full-package-validation \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  verify-release-merge:
    name: Verify Release Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      pull-requests: read
    steps:
      - name: Verify push commit is associated with a pull request
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            if (!response.data.length) {
              core.setFailed('Direct pushes to release branches are not allowed. Merge through a pull request.');
              return;
            }
            const mergedPull = response.data.find((pull) => pull.merged_at);
            if (!mergedPull) {
              core.setFailed('Push commit is not associated with a merged pull request.');
            }

  deploy-testorg:
    name: Deploy To Testing Org
    runs-on: ubuntu-latest
    needs: verify-release-merge
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Deploy source to Testing Org
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30 \
            --concise

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  post-deploy-tests:
    name: Post-Deploy Tests
    runs-on: ubuntu-latest
    needs: deploy-testorg
    if: github.event_name == 'push'
    steps:
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Run post-deploy Apex tests in Testing Org
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  release-pipeline:
    name: release-pipeline
    runs-on: ubuntu-latest
    needs: testorg-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Mark release pipeline successful
        run: echo "Release pull request validation completed successfully."

  release-deployment:
    name: Release Deployment
    runs-on: ubuntu-latest
    needs: post-deploy-tests
    if: github.event_name == 'push'
    steps:
      - name: Mark release deployment successful
        run: echo "Release branch deployment completed successfully."
