name: Release Pipeline

on:
  push:
    branches:
      - 'release/**'

jobs:
  pmd-scan:
    name: PMD Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run PMD scan
        run: |
          sf scanner run \
            --target "./force-app/**/*.cls,./force-app/**/*.trigger" \
            --engine pmd \
            --severity-threshold 2 \
            --format csv \
            --outfile pmd-results.csv

      - name: Upload PMD results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-results
          path: pmd-results.csv
          if-no-files-found: ignore

  eslint-scan:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Salesforce Scanner security rules
        run: |
          sf scanner run \
            --target "./force-app" \
            --category "Security" \
            --severity-threshold 1 \
            --format csv \
            --outfile scanner-security-results.csv

      - name: Upload scanner security results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-security-results
          path: scanner-security-results.csv
          if-no-files-found: ignore

  apex-tests:
    name: Apex Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Run Apex tests with coverage
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30 | tee apex-test-results.txt
          COVERAGE=$(awk '/Org Wide Coverage/ {gsub(/[^0-9]/, "", $NF); print $NF}' apex-test-results.txt | tail -n 1)
          if [ -z "$COVERAGE" ]; then
            echo "Unable to determine org-wide Apex coverage from test output."
            exit 1
          fi
          if [ "$COVERAGE" -lt 75 ]; then
            echo "Org-wide Apex coverage is below 75%: ${COVERAGE}%"
            exit 1
          fi

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  release-package:
    name: Build And Deploy Beta
    runs-on: ubuntu-latest
    needs:
      - pmd-scan
      - eslint-scan
      - security-scan
      - apex-tests
    permissions:
      contents: write
    env:
      DEVHUB_SFDX_URL: ${{ secrets.DEVHUB_SFDX_URL }}
      TESTORG_SFDX_URL: ${{ secrets.TESTORG_SFDX_URL }}
      PACKAGE_ID: ${{ secrets.PACKAGE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate package deployment secrets
        run: |
          test -n "$DEVHUB_SFDX_URL" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }
          test -n "$TESTORG_SFDX_URL" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "$DEVHUB_SFDX_URL" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Write Testing Org auth URL to file
        run: echo "$TESTORG_SFDX_URL" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Build beta package version
        id: pkg
        if: ${{ env.PACKAGE_ID != '' }}
        run: |
          RESULT=$(sf package version create \
            --package "$PACKAGE_ID" \
            --installation-key-bypass \
            --code-coverage \
            --wait 30 \
            --json)
          echo "VERSION_ID=$(echo "$RESULT" | jq -r '.result.SubscriberPackageVersionId')" >> "$GITHUB_OUTPUT"

      - name: Install beta package in Testing Org
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          sf package install \
            --package ${{ steps.pkg.outputs.VERSION_ID }} \
            --target-org testorg \
            --installation-key-bypass \
            --wait 30

      - name: Run full test suite in Testing Org after install
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Save version ID to .version-id file and commit
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          echo "${{ steps.pkg.outputs.VERSION_ID }}" > .version-id
          git config user.email "ci-bot@yourdomain.com"
          git config user.name "CI Bot"
          git add .version-id
          git commit -m "chore: update beta version ID [skip ci]" || echo "No changes to commit"
          git push

      - name: Create a Git tag for this beta
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          TAG="beta-${{ github.ref_name }}-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Skip package build until PACKAGE_ID is configured
        if: ${{ env.PACKAGE_ID == '' }}
        run: echo "PACKAGE_ID is not configured. Package build, install, version persistence, and beta tagging are skipped."

      - name: Clean up auth files
        if: always()
        run: rm -f devhub.sfdx-url testorg.sfdx-url

  release-pipeline:
    name: release-pipeline
    runs-on: ubuntu-latest
    needs:
      - pmd-scan
      - eslint-scan
      - security-scan
      - apex-tests
      - release-package
    steps:
      - name: Mark release pipeline successful
        run: echo "Release pipeline completed successfully."
