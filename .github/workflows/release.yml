name: Release Pipeline

on:
  push:
    branches:
      - 'release/**'

jobs:
  pmd-scan:
    name: PMD Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run PMD scan
        run: |
          sf scanner run \
            --target "./force-app/**/*.cls" \
            --target "./force-app/**/*.trigger" \
            --engine pmd \
            --severity-threshold 2 \
            --format table \
            --verbose-violations

  eslint-scan:
    name: ESLint
    runs-on: ubuntu-latest
    needs: pmd-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: eslint-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Salesforce Scanner security rules
        run: |
          sf scanner run \
            --target "./force-app" \
            --category "Security" \
            --severity-threshold 1 \
            --format table \
            --verbose-violations

  xml-validation:
    name: XML Validation
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML files
        run: find force-app manifest -type f -name '*.xml' -print0 | xargs -0 xmllint --noout

  metadata-validation:
    name: Metadata Validation
    runs-on: ubuntu-latest
    needs: xml-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required Dev Hub secret
        run: test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Create scratch org
        run: |
          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias ci-scratch \
            --duration-days 1 \
            --set-default \
            --wait 30

      - name: Validate metadata deployment to scratch org
        run: |
          sf project deploy start \
            --target-org ci-scratch \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --dry-run \
            --wait 30

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt || true

      - name: Clean up auth file
        if: always()
        run: rm -f devhub.sfdx-url

  appexchange-review:
    name: AppExchange Review
    runs-on: ubuntu-latest
    needs: metadata-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Code Analyzer v5
        run: sf plugins install code-analyzer

      - name: Run AppExchange security review scan
        run: |
          sf code-analyzer run \
            --rule-selector AppExchange \
            --rule-selector Recommended:Security \
            --severity-threshold 2 \
            --view detail

  scratch-source-deploy:
    name: Scratch Deploy
    runs-on: ubuntu-latest
    needs:
      - appexchange-review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required Dev Hub secret
        run: test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Create scratch org
        run: |
          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias ci-scratch \
            --duration-days 1 \
            --set-default \
            --wait 30

      - name: Deploy source to scratch org
        run: |
          sf project deploy start \
            --target-org ci-scratch \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt || true

      - name: Clean up auth file
        if: always()
        run: rm -f devhub.sfdx-url

  scratch-apex-tests:
    name: Apex Tests
    runs-on: ubuntu-latest
    needs: scratch-source-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required Dev Hub secret
        run: test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Create scratch org
        run: |
          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias ci-scratch \
            --duration-days 1 \
            --set-default \
            --wait 30

      - name: Deploy source to scratch org
        run: |
          sf project deploy start \
            --target-org ci-scratch \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30

      - name: Run Apex tests in scratch org
        run: |
          sf apex run test \
            --target-org ci-scratch \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt || true

      - name: Clean up auth file
        if: always()
        run: rm -f devhub.sfdx-url

  scratch-apex-coverage:
    name: Apex Coverage
    runs-on: ubuntu-latest
    needs: scratch-apex-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required Dev Hub secret
        run: test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Create scratch org
        run: |
          sf org create scratch \
            --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias ci-scratch \
            --duration-days 1 \
            --set-default \
            --wait 30

      - name: Deploy source to scratch org
        run: |
          sf project deploy start \
            --target-org ci-scratch \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30

      - name: Run Apex tests in scratch org for coverage
        run: |
          sf apex run test \
            --target-org ci-scratch \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Verify org-wide Apex coverage in scratch org
        run: |
          ORG_COVERAGE_JSON=$(sf data query \
            --use-tooling-api \
            --json \
            --target-org ci-scratch \
            --query "SELECT PercentCovered FROM ApexOrgWideCoverage")
          ORG_COVERAGE_PCT=$(echo "$ORG_COVERAGE_JSON" | jq -r '.result.records[0].PercentCovered // empty')
          if [ -z "$ORG_COVERAGE_PCT" ]; then
            echo "Unable to determine org-wide Apex coverage from tooling query."
            exit 1
          fi
          if ! awk "BEGIN {exit !($ORG_COVERAGE_PCT >= 75)}"; then
            echo "Org-wide Apex coverage is below 75%: ${ORG_COVERAGE_PCT}%"
            exit 1
          fi

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt || true

      - name: Clean up auth file
        if: always()
        run: rm -f devhub.sfdx-url

  deploy-testorg:
    name: Deploy To Testing Org
    runs-on: ubuntu-latest
    needs: scratch-apex-coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Deploy source to Testing Org
        run: |
          sf project deploy start \
            --target-org testorg \
            --source-dir force-app/main/default \
            --ignore-conflicts \
            --wait 30 \
            --concise

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  post-deploy-tests:
    name: Post-Deploy Tests
    runs-on: ubuntu-latest
    needs: deploy-testorg
    steps:
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Validate required test org secret
        run: test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Run post-deploy Apex tests in Testing Org
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Clean up auth file
        if: always()
        run: rm -f testorg.sfdx-url

  release-pipeline:
    name: release-pipeline
    runs-on: ubuntu-latest
    needs: post-deploy-tests
    steps:
      - name: Mark release pipeline successful
        run: echo "Release pipeline completed successfully."
