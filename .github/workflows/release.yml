name: Release Pipeline

on:
  push:
    branches:
      - 'release/**'

jobs:
  release-pipeline:
    name: release-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Scanner plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Validate required release secrets
        run: |
          test -n "${{ secrets.DEVHUB_SFDX_URL }}" || { echo "Missing DEVHUB_SFDX_URL"; exit 1; }
          test -n "${{ secrets.TESTORG_SFDX_URL }}" || { echo "Missing TESTORG_SFDX_URL"; exit 1; }

      - name: Write Dev Hub auth URL to file
        run: echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub.sfdx-url

      - name: Authenticate Dev Hub via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file devhub.sfdx-url \
            --set-default-dev-hub \
            --alias devhub

      - name: Write Testing Org auth URL to file
        run: echo "${{ secrets.TESTORG_SFDX_URL }}" > testorg.sfdx-url

      - name: Authenticate Testing Org via sfdx-url
        run: |
          sf org login sfdx-url \
            --sfdx-url-file testorg.sfdx-url \
            --alias testorg

      - name: Run quality gates
        uses: ./.github/actions/quality-gates

      - name: Build beta package version
        id: pkg
        if: ${{ secrets.PACKAGE_ID != '' }}
        run: |
          RESULT=$(sf package version create \
            --package "${{ secrets.PACKAGE_ID }}" \
            --installation-key-bypass \
            --code-coverage \
            --wait 30 \
            --json)
          echo "VERSION_ID=$(echo "$RESULT" | jq -r '.result.SubscriberPackageVersionId')" >> "$GITHUB_OUTPUT"

      - name: Install beta package in Testing Org
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          sf package install \
            --package ${{ steps.pkg.outputs.VERSION_ID }} \
            --target-org testorg \
            --installation-key-bypass \
            --wait 30

      - name: Run full test suite in Testing Org after install
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --wait 30

      - name: Save version ID to .version-id file and commit
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          echo "${{ steps.pkg.outputs.VERSION_ID }}" > .version-id
          git config user.email "ci-bot@yourdomain.com"
          git config user.name "CI Bot"
          git add .version-id
          git commit -m "chore: update beta version ID [skip ci]" || echo "No changes to commit"
          git push

      - name: Create a Git tag for this beta
        if: ${{ steps.pkg.outputs.VERSION_ID != '' }}
        run: |
          TAG="beta-${{ github.ref_name }}-$(date +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Skip package build until PACKAGE_ID is configured
        if: ${{ secrets.PACKAGE_ID == '' }}
        run: echo "PACKAGE_ID is not configured. Package build, install, version persistence, and beta tagging are skipped."

      - name: Clean up key files
        if: always()
        run: rm -f devhub.sfdx-url testorg.sfdx-url
